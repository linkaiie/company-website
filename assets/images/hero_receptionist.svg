<svg width="640" height="560" viewBox="0 0 640 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phone call answered by an AI receptionist that books an appointment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFCF7"/>
      <stop offset="1" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6B5D"/>
      <stop offset="1" stop-color="#178B78"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C35B32"/>
      <stop offset="1" stop-color="#9E4626"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#140C08" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="624" height="544" rx="32" fill="url(#bg)" stroke="rgba(30,24,18,0.12)"/>

  <!-- Incoming call card -->
  <g filter="url(#soft)">
    <rect x="56" y="60" width="300" height="120" rx="20" fill="#FFFFFF" stroke="rgba(30,24,18,0.10)"/>
    <circle cx="104" cy="120" r="28" fill="url(#warm)"/>
    <path d="M94 110c0-3 2-5 5-5l5 1 2 7-4 3c2 4 5 7 9 9l3-4 7 2 1 5c0 3-2 5-5 5-13 0-23-10-23-23z" fill="#FFF" />
    <rect x="150" y="98" width="150" height="13" rx="6" fill="rgba(30,24,18,0.16)"/>
    <rect x="150" y="122" width="110" height="11" rx="5" fill="rgba(30,24,18,0.10)"/>
    <rect x="150" y="142" width="80" height="11" rx="5" fill="rgba(195,91,50,0.35)"/>
  </g>

  <!-- Arrow down -->
  <path d="M200 196 L200 232 M188 222 L200 234 L212 222" stroke="#0F6B5D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI assistant orb -->
  <g filter="url(#soft)">
    <circle cx="200" cy="300" r="52" fill="url(#accent)"/>
    <circle cx="200" cy="300" r="52" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- sound waves -->
    <path d="M178 300c0-2 1-3 3-3s3 1 3 3v0c0 2-1 3-3 3s-3-1-3-3z" fill="#FFF"/>
    <rect x="184" y="288" width="6" height="24" rx="3" fill="#FFF"/>
    <rect x="194" y="280" width="6" height="40" rx="3" fill="#FFF"/>
    <rect x="204" y="286" width="6" height="28" rx="3" fill="#FFF"/>
    <rect x="214" y="292" width="6" height="16" rx="3" fill="#FFF"/>
  </g>
  <text x="200" y="380" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#17130F">Aoife · AI receptionist</text>
  <text x="200" y="402" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#6E6256">“Hi! I can book that in for you…”</text>

  <!-- Arrow right -->
  <path d="M268 300 L312 300 M302 288 L314 300 L302 312" stroke="#0F6B5D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Calendar / booking card -->
  <g filter="url(#soft)">
    <rect x="332" y="220" width="252" height="270" rx="22" fill="#FFFFFF" stroke="rgba(30,24,18,0.10)"/>
    <rect x="332" y="220" width="252" height="56" rx="22" fill="url(#accent)"/>
    <rect x="332" y="254" width="252" height="22" fill="url(#accent)"/>
    <text x="358" y="255" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Booked ✓</text>
    <text x="358" y="312" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#17130F">Tomorrow · 10:30</text>
    <rect x="358" y="326" width="160" height="10" rx="5" fill="rgba(30,24,18,0.12)"/>
    <rect x="358" y="346" width="120" height="10" rx="5" fill="rgba(30,24,18,0.08)"/>

    <line x1="358" y1="378" x2="558" y2="378" stroke="rgba(30,24,18,0.08)" stroke-width="2"/>

    <circle cx="368" cy="408" r="8" fill="rgba(15,107,93,0.18)"/>
    <rect x="386" y="402" width="120" height="10" rx="5" fill="rgba(30,24,18,0.12)"/>
    <circle cx="368" cy="438" r="8" fill="rgba(15,107,93,0.18)"/>
    <rect x="386" y="432" width="150" height="10" rx="5" fill="rgba(30,24,18,0.10)"/>
    <circle cx="368" cy="468" r="8" fill="rgba(195,91,50,0.30)"/>
    <rect x="386" y="462" width="90" height="10" rx="5" fill="rgba(30,24,18,0.08)"/>
  </g>

  <!-- Notification chip -->
  <g filter="url(#soft)">
    <rect x="60" y="430" width="210" height="62" rx="16" fill="#FFFFFF" stroke="rgba(30,24,18,0.10)"/>
    <circle cx="92" cy="461" r="18" fill="rgba(15,107,93,0.12)"/>
    <path d="M92 451v10l6 4" stroke="#0F6B5D" stroke-width="3" stroke-linecap="round"/>
    <rect x="120" y="448" width="130" height="10" rx="5" fill="rgba(30,24,18,0.14)"/>
    <rect x="120" y="466" width="96" height="9" rx="4" fill="rgba(30,24,18,0.08)"/>
  </g>
</svg>
